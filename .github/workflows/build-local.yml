name: Build Dev Local (No EAS Quota)

on:
  workflow_dispatch:

jobs:
  build-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: pnpm install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK Dev Client LOCAL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          EAS_SKIP_AUTO_FINGERPRINT=1 eas build --profile development --platform android --local --non-interactive --output=./build.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonhub-dev-apk
          path: ./build.apk